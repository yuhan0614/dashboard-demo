<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px}
header{background:#0f0f10;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:18px}
.brand{font-weight:800;letter-spacing:.35em;font-size:20px;padding-right:18px;border-right:1px solid #444}
header h1{font-size:16px;margin:0;font-weight:600}
header .sub{font-size:12px;color:#aaa;margin-top:2px}
header .right{margin-left:auto;text-align:right;font-size:12px;color:#ccc;line-height:1.7}
.demo-badge{display:inline-block;background:#f5b400;color:#111;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:8px;vertical-align:2px}
.toolbar{background:#fff;padding:12px 20px 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1px solid #d6d9de;background:#fff;border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.toolbar input[type=date]{border:1px solid #d6d9de;border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit}
.btn-go{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;font-size:13px}

.status{background:#fff;padding:0 20px 10px;font-size:12px;color:var(--pos)}
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 16px;font-size:14px;cursor:pointer;color:#555;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:var(--accent-dark);border-bottom-color:var(--accent);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;padding:14px 14px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi.alt{background:#eef4fc}
.kpi .l{font-size:12px;color:#444;margin-bottom:6px}
.kpi .v{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;margin-top:4px}
.kpi .x{font-size:11px;color:var(--muted);margin-top:2px}
.up{color:var(--pos)}.down{color:var(--neg)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.grid-half{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;min-width:0}
.grid2 .card,.grid-half .card{margin-bottom:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px}
.card-h .note{font-size:12px;color:var(--muted)}
.seg{margin-left:auto;display:flex;gap:4px}
.seg button{border:1px solid #d6d9de;background:#fff;border-radius:14px;padding:3px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chart{position:relative;height:300px}

.tbl-wrap{overflow-x:auto;max-height:520px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#f7f8fa;font-weight:600;color:#444;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}

td{padding:8px 10px;border-bottom:1px solid #f0f1f3;text-align:right;white-space:nowrap}
tr.total td{font-weight:700;background:#fafbfc}
tr.child td{background:#fbfcfe;font-size:12px;color:#444}
tr.child td:first-child{padding-left:30px}
.tog{cursor:pointer;color:#999;margin-right:6px;font-size:10px;display:inline-block;width:10px}
.share{display:flex;align-items:center;gap:6px;justify-content:flex-end}

.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#eef1f5;color:#555;margin-right:6px}
.thumb{width:44px;height:44px;border-radius:6px;display:inline-block;vertical-align:middle}
.bar-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.bar-row{display:grid;grid-template-columns:70px 1fr 54px;align-items:center;gap:8px;font-size:12px}
.bar-row .track{background:#f0f1f3;border-radius:4px;height:10px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--blue);border-radius:4px}
.warn{background:#fff7e6;border:1px solid #ffe2a8;color:#8a5a00;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:16px}
select{border:1px solid #d6d9de;border-radius:8px;padding:5px 10px;font-family:inherit;font-size:13px}
.legend-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.hidden{display:none}
.br{display:none}
.loading{opacity:.4;pointer-events:none;transition:opacity .2s}
@media (max-width:900px){
  .grid2,.grid-half{grid-template-columns:1fr}
  header{flex-wrap:wrap;padding:12px 16px}
  header .right{margin-left:0;text-align:left}
  .toolbar,.status,nav{padding-left:16px;padding-right:16px}
  main{padding:14px 16px 30px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

  .brand{font-size:16px;padding-right:12px}
  .phase-bar{padding:0 8px;gap:0}
  .phase-bar button{padding:10px 10px;font-size:13px}
  .phase-bar .info{font-size:11px;padding:2px 4px 8px;line-height:1.6}
  .toolbar{gap:6px;padding:10px 12px 6px}
  .pill{padding:5px 11px;font-size:12px}
  .br{display:block;width:100%;height:0}
  .toolbar input[type=date]{flex:1;min-width:0;padding:5px 6px;font-size:12px}
  .btn-go{padding:7px 12px;font-size:12px}
  .status{padding:0 12px 8px;font-size:11px}
  nav{padding:0 4px}
  nav button{padding:11px 11px;font-size:13px}
  main{padding:12px 10px 30px}
  .kpis{gap:8px;margin-bottom:12px}
  .kpi{padding:11px 11px 10px;border-radius:10px}
  .kpi .l{font-size:11px}
  .kpi .v{font-size:17px}
  .kpi .x{font-size:10px}

  .card{padding:14px 12px;border-radius:10px;margin-bottom:12px}
  .card-h{gap:8px}
  .card-h h3{font-size:14px}
  .chart{height:240px}
  .chart.sm{height:220px}
  table{font-size:12px}
  th,td{padding:7px 8px}
  .tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;z-index:2;white-space:normal;min-width:96px;max-width:150px;box-shadow:1px 0 0 var(--line)}

  .thumb{width:34px;height:34px}

  .fn-row{grid-template-columns:72px 1fr 64px;font-size:12px}
  .bar-row{grid-template-columns:56px 1fr 46px}
}
</style>

<script>
/* =====================================================================
 *  電商成效儀表板 — 可重複套用的模板
 *  客戶設定全部在 config.js；資料層在 DataSource（目前為 mock）。
 *  接正式資料時：實作 DataSource.load() 改打後端 API（token 只放後端）。
 * ===================================================================== */
const CFG = window.DASHBOARD_CONFIG;

/* ---------- 格式化 ---------- */
const fmtN = n => (isFinite(n) ? Math.round(n) : 0).toLocaleString('en-US');
const fmtM = n => CFG.currency + fmtN(n);
const fmtX = n => (isFinite(n) && n > 0) ? n.toFixed(2) + 'x' : '—';
const fmtP = (n, d = 1) => isFinite(n) ? (n * 100).toFixed(d) + '%' : '—';
const fmtW = n => n >= 1e4 ? (n / 1e4).toFixed(1) + '萬' : fmtN(n);
const fmtT = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const div = (a, b) => b ? a / b : NaN;
const sum = (arr, k) => arr.reduce((s, r) => s + (typeof k === 'function' ? k(r) : r[k] || 0), 0);
const iso = d => d.toISOString().slice(0, 10);
const addDays = (ds, n) => { const d = new Date(ds + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5) + 1;

/* ---------- 可重現的亂數（同一天永遠同一組假資料） ---------- */
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = hash(String(seed)); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
 *  Mock 資料產生器
 * ===================================================================== */
const Mock = (() => {
  const S = CFG.mock;
  function promo(ds) {
    const md = ds.slice(5);
    const map = { '11-11': 3.2, '11-10': 1.5, '11-12': 1.9, '11-09': 1.15, '12-12': 2.3, '12-11': 1.3, '06-18': 2.0, '06-17': 1.3, '09-09': 1.6, '10-10': 1.5, '01-01': 1.4 };
    return map[md] || 1;
  }
  const dayCache = {};
  function day(ds) {
    if (dayCache[ds]) return dayCache[ds];
    const r = rng(ds + CFG.brand), n = (v = .3) => 1 - v / 2 + r() * v;
    const d = new Date(ds + 'T00:00:00Z');

    const doy = (d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
    const season = 1 + 0.12 * Math.sin((doy - 80) / 365 * 2 * Math.PI);
    const p = promo(ds), ps = Math.sqrt(p);
    const aov = S.aov * n(.18) * (p > 1.5 ? 0.92 : 1);
    const orders = S.dailyOrders * wf * season * p * n(.25);
    const revenue = orders * aov;
    const cancelRate = 0.1 + r() * 0.09;
    const gmv = revenue / (1 - cancelRate);
    const mSpend = S.metaSpend * wf * ps * n(.35), gSpend = S.googleSpend * wf * ps * n(.35);
    const mPur = mSpend / (S.metaCpa * n(.3) / (p > 1.5 ? 1.25 : 1)), gPur = gSpend / (S.googleCpa * n(.3) / (p > 1.5 ? 1.2 : 1));

    const sessions = orders / (0.0135 * n(.3) * (p > 1.5 ? 1.6 : 1));
    const gaPur = orders * 0.93 * n(.1);
    const gaRev = revenue * 0.91 * n(.08);
    const adShare = Math.max(0.03, (0.26 - (p > 1.5 ? 0.16 : 0)) * n(.4));
    const ch = { 廣告: adShare, Line推播: 0.06 * n(.6), 社群: 0.05 * n(.5), 自然搜尋: 0.08 * n(.4), Direct: 0.16 * n(.4) };
    ch.其他 = Math.max(0.05, 1 - Object.values(ch).reduce((a, b) => a + b, 0));
    const chT = { 廣告: 0.38 * n(.3), Line推播: 0.05 * n(.5), 社群: 0.07 * n(.4), 自然搜尋: 0.07 * n(.4), Direct: 0.2 * n(.3) };
    chT.其他 = Math.max(0.05, 1 - Object.values(chT).reduce((a, b) => a + b, 0));
    return dayCache[ds] = {
      date: ds,
      shop: { gmv, revenue, orders, cancel: gmv - revenue, refund: revenue * 0.004 * r() },
      meta: { spend: mSpend, imp: mImp, clk: mClk, atc: mPur * 9 * n(.3), pur: mPur, val: mPur * aov * 0.95 * n(.15) },
      google: { spend: gSpend, imp: gImp, clk: gClk, pur: gPur, val: gPur * aov * 0.78 * n(.2) },
      ga4: { sessions, atc: sessions * 0.15 * n(.3), pur: gaPur, rev: gaRev, adRev: gaRev * adShare, dur: 230 * n(.3), bounce: 0.13 * n(.5),
        chRev: Object.fromEntries(Object.entries(ch).map(([k, v]) => [k, v * gaRev])),

  }
  /* 依權重把總數拆給各項目，並加上每個區間固定的雜訊 */

    const mt = state.gran.gMetric || 'spend';
    if (mt === 'spend') comboChart('cG', bs.map(b => b.label), [{ label: '花費', data: bs.map(b => b.a.spend), color: 'rgba(88,165,92,.5)', border: '#58a55c' }], { label: 'ROAS', data: bs.map(b => div(b.a.val, b.a.spend)) });
    else if (mt === 'roas') comboChart('cG', bs.map(b => b.label), [{ label: '營收', data: bs.map(b => b.a.val), color: 'rgba(214,51,138,.35)', border: '#d6338a' }], { label: 'ROAS', data: bs.map(b => div(b.a.val, b.a.spend)) });
    else comboChart('cG', bs.map(b => b.label), [{ label: '購買', data: bs.map(b => b.a.pur), color: 'rgba(123,92,214,.45)', border: '#7b5cd6' }], { label: 'CPA', data: bs.map(b => div(b.a.spend, b.a.pur)), fmt: fmtM, tick: v => CFG.currency + v }, { yFmt: fmtN, yTick: fmtN });
    donut('cGPie', cs.map(c => c.name), cs.map(c => c.spend), PALETTE.slice(1).concat(PALETTE[0]));
  };
  return { html, draw };
};

/* =====================================================================
 *  渲染與事件
 * ===================================================================== */
function render() {
  const v = Views[state.tab]();
  document.getElementById('main').innerHTML = v.html;
  v.draw();
}
async function loadData() {
  const main = document.getElementById('main'); main.classList.add('loading');
  document.getElementById('status').textContent = '⏳ 讀取中…';
  const n = daysBetween(state.from, state.to);
  const [cur, prev] = await Promise.all([DataSource.load(state.from, state.to), DataSource.load(addDays(state.from, -n), addDays(state.from, -1))]);
  state.cur = cur; state.prev = prev;
  document.getElementById('status').textContent = `✓ 完成・${CFG.mock.metaCampaigns.length + CFG.mock.googleCampaigns.length} campaigns・${CFG.mock.creatives.length} 素材・比較區間 ${addDays(state.from, -n)} ~ ${addDays(state.from, -1)}`;
  main.classList.remove('loading');
  render();
}
function setPreset(p) {
  const y = addDays(TODAY, -1);
  if (p === 'today') { state.from = state.to = TODAY; }
  else if (p === 'yesterday') { state.from = state.to = y; }
  else if (p === 'month') { state.from = TODAY.slice(0, 8) + '01'; state.to = TODAY === state.from ? TODAY : y; }
  else { state.from = addDays(TODAY, -Number(p)); state.to = y; }
  document.getElementById('dFrom').value = state.from; document.getElementById('dTo').value = state.to;
  document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === p));
}

function init() {
  document.title = `${CFG.brandDisplay} 成效儀表板`;
  document.getElementById('brandName').textContent = CFG.brandDisplay;
  document.getElementById('accountLine').textContent = `帳戶 ID：${CFG.accountId} · ${CFG.currencyCode}`;
  document.getElementById('lastUpdate').textContent = TODAY;
  document.getElementById('demoBadge').classList.toggle('hidden', !CFG.showDemoBadge);
  document.documentElement.style.setProperty('--accent', CFG.accent);
  document.documentElement.style.setProperty('--accent-dark', CFG.accentDark);
  const nav = document.getElementById('tabs');
  nav.innerHTML = CFG.tabs.map(t => `<button data-tab="${t.id}" class="${t.id === state.tab ? 'on' : ''}">${t.label}</button>`).join('');
  nav.onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; state.tab = b.dataset.tab; nav.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { setPreset(b.dataset.preset); loadData(); });
  document.getElementById('dFrom').onchange = e => { state.from = e.target.value; document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('on')); };
  document.getElementById('dTo').onchange = e => { state.to = e.target.value; document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('on')); };
  document.getElementById('btnRefresh').onclick = () => { if (state.from > state.to) { alert('起始日不能晚於結束日'); return; } loadData(); };

  const main = document.getElementById('main');
  main.addEventListener('click', e => {
    const sb = e.target.closest('[data-seg] button');
    if (sb) { const id = sb.parentElement.dataset.seg; if (id === 'prodCat') state.filters.prodCat = sb.dataset.v; else state.gran[id] = sb.dataset.v; render(); return; }
    const tg = e.target.closest('[data-tog]');
    if (tg) { const [tid, rid] = tg.dataset.tog.split('|'); const k = `${tid}-open-${rid}`; state.filters[k] = !state.filters[k]; refreshTable(tid); return; }
    const th = e.target.closest('th[data-sort]');
    if (th) { const [tid, k] = th.dataset.sort.split('|'); const t = tables[tid]; t.sort = t.sort && t.sort.k === k ? { k, dir: -t.sort.dir } : { k, dir: -1 }; refreshTable(tid); }
  });
  main.addEventListener('change', e => { if (e.target.id === 'crCamp') { state.filters.crCamp = e.target.value; render(); } });

  setPreset(CFG.defaultPreset || '7');
  loadData();
}
init();
</script>
